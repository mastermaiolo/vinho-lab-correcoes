<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#FFFFFF" stroke-opacity=".03" stroke-width="1"/></pattern>
</defs>
<rect x="2" y="2" width="1196" height="356" rx="16" fill="#0B0D0F" stroke="#2A2D31" stroke-width="1"/>
<rect x="3" y="3" width="1194" height="354" fill="url(#grid)"/>

<!-- Header -->
<text x="40" y="44" font-family="JetBrains Mono, monospace" font-size="12px" font-weight="600" fill="#C86D51" letter-spacing="2">FOUR SPECIALISED ENOLOGICAL WORKSPACES</text>
<text x="1160" y="44" font-family="JetBrains Mono, monospace" font-size="12px" font-weight="600" fill="#8E8A82" text-anchor="end">AI DIAGNOSTICS &amp; REMEDY CATALOGUE</text>
<line x1="40" y1="58" x2="1160" y2="58" stroke="#2A2D31" stroke-width="1"/>

<!-- Module 1: Correções (Input & Ingestion) -->
<g transform="translate(40, 78)">
  <rect x="0" y="0" width="265" height="254" rx="10" fill="#13161A" stroke="#2A2D31" stroke-width="1"/>
  <rect x="0" y="0" width="265" height="3" fill="#AD283B" rx="1.5"/>
  <text x="16" y="28" font-family="JetBrains Mono, monospace" font-size="11px" font-weight="600" fill="#AD283B">01 / FORMULÁRIO &amp; INGESTÃO</text>
  
  <g transform="translate(16, 44)">
    <text x="0" y="16" font-family="Inter, sans-serif" font-size="11.5px" font-weight="600" fill="#E9E5DC">• Parâmetros de Bancada:</text>
    <text x="0" y="34" font-family="Inter, sans-serif" font-size="11.5px" font-weight="400" fill="#8E8A82">  TAV, pH, SO₂ L/T, AV, AT, ESR</text>
    <text x="0" y="56" font-family="Inter, sans-serif" font-size="11.5px" font-weight="600" fill="#E9E5DC">• Seleção de Sintomas:</text>
    <text x="0" y="74" font-family="Inter, sans-serif" font-size="11.5px" font-weight="400" fill="#8E8A82">  Olfato, Paladar, Aspeto Visual</text>
    <text x="0" y="96" font-family="Inter, sans-serif" font-size="11.5px" font-weight="600" fill="#E9E5DC">• Ingestão Companheiro:</text>
    <text x="0" y="114" font-family="Inter, sans-serif" font-size="11.5px" font-weight="400" fill="#8E8A82">  Parser .json e .md direto</text>
    <text x="0" y="136" font-family="Inter, sans-serif" font-size="11.5px" font-weight="600" fill="#E9E5DC">• Seleção de Jurisdição:</text>
    <text x="0" y="154" font-family="Inter, sans-serif" font-size="11.5px" font-weight="400" fill="#8E8A82">  Portugal/UE (IVV) ou Brasil (MAPA)</text>
    <text x="0" y="196" font-family="JetBrains Mono, monospace" font-size="9.5px" fill="#AD283B">&gt; Auto-fill instantâneo</text>
  </g>
</g>

<!-- Module 2: AI Diagnosis -->
<g transform="translate(325, 78)">
  <rect x="0" y="0" width="265" height="254" rx="10" fill="#13161A" stroke="#2A2D31" stroke-width="1"/>
  <rect x="0" y="0" width="265" height="3" fill="#C86D51" rx="1.5"/>
  <text x="16" y="28" font-family="JetBrains Mono, monospace" font-size="11px" font-weight="600" fill="#C86D51">02 / DIAGNÓSTICO IA</text>
  
  <g transform="translate(16, 44)">
    <text x="0" y="16" font-family="Inter, sans-serif" font-size="11.5px" font-weight="600" fill="#E9E5DC">• Diagnóstico Primário &amp; Probabilidade</text>
    <text x="0" y="36" font-family="Inter, sans-serif" font-size="11.5px" font-weight="600" fill="#E9E5DC">• Causa Bioquímica Raiz</text>
    <text x="0" y="56" font-family="Inter, sans-serif" font-size="11.5px" font-weight="600" fill="#E9E5DC">• Protocolo de Confirmação:</text>
    <text x="0" y="74" font-family="Inter, sans-serif" font-size="11.5px" font-weight="400" fill="#8E8A82">  Ensaio laboratorial + teste rápido</text>
    <text x="0" y="96" font-family="Inter, sans-serif" font-size="11.5px" font-weight="600" fill="#E9E5DC">• Prescrição Enológica:</text>
    <text x="0" y="114" font-family="Inter, sans-serif" font-size="11.5px" font-weight="400" fill="#8E8A82">  Intervenção urgente vs preventiva</text>
    <text x="0" y="136" font-family="Inter, sans-serif" font-size="11.5px" font-weight="600" fill="#E9E5DC">• Referência Legal da Prática</text>
    <text x="0" y="156" font-family="Inter, sans-serif" font-size="11.5px" font-weight="600" fill="#E9E5DC">• Grau de Reversibilidade</text>
    <text x="0" y="196" font-family="JetBrains Mono, monospace" font-size="9.5px" fill="#C86D51">&gt; 4 Provedores de IA</text>
  </g>
</g>

<!-- Module 3: Calculadoras -->
<g transform="translate(610, 78)">
  <rect x="0" y="0" width="265" height="254" rx="10" fill="#13161A" stroke="#2A2D31" stroke-width="1"/>
  <rect x="0" y="0" width="265" height="3" fill="#B62B32" rx="1.5"/>
  <text x="16" y="28" font-family="JetBrains Mono, monospace" font-size="11px" font-weight="600" fill="#B62B32">03 / CALCULADORAS DE DOSE</text>
  
  <g transform="translate(16, 44)">
    <text x="0" y="16" font-family="Inter, sans-serif" font-size="11.5px" font-weight="600" fill="#E9E5DC">• SO₂ Molecular (Sudraud-Chauvet):</text>
    <text x="0" y="34" font-family="Inter, sans-serif" font-size="11.5px" font-weight="400" fill="#8E8A82">  Target 0.8 ppm para proteção biológica</text>
    <text x="0" y="56" font-family="Inter, sans-serif" font-size="11.5px" font-weight="600" fill="#E9E5DC">• Correção de Acidez:</text>
    <text x="0" y="74" font-family="Inter, sans-serif" font-size="11.5px" font-weight="400" fill="#8E8A82">  Acidificação tartárica com teto legal</text>
    <text x="0" y="96" font-family="Inter, sans-serif" font-size="11.5px" font-weight="600" fill="#E9E5DC">• Desacidificação Química:</text>
    <text x="0" y="114" font-family="Inter, sans-serif" font-size="11.5px" font-weight="400" fill="#8E8A82">  Doses com CaCO₃ ou K₂CO₃</text>
    <text x="0" y="136" font-family="Inter, sans-serif" font-size="11.5px" font-weight="600" fill="#E9E5DC">• Chaptalização / Enriquecimento</text>
    <text x="0" y="156" font-family="Inter, sans-serif" font-size="11.5px" font-weight="600" fill="#E9E5DC">• Validação de Limites Máximos</text>
    <text x="0" y="196" font-family="JetBrains Mono, monospace" font-size="9.5px" fill="#B62B32">&gt; Fórmulas Enológicas Exatas</text>
  </g>
</g>

<!-- Module 4: Fichas & Produtos -->
<g transform="translate(895, 78)">
  <rect x="0" y="0" width="265" height="254" rx="10" fill="#13161A" stroke="#2A2D31" stroke-width="1"/>
  <rect x="0" y="0" width="265" height="3" fill="#E9E5DC" rx="1.5"/>
  <text x="16" y="28" font-family="JetBrains Mono, monospace" font-size="11px" font-weight="600" fill="#E9E5DC">04 / ATLAS &amp; PRODUTOS</text>
  
  <g transform="translate(16, 44)">
    <text x="0" y="16" font-family="Inter, sans-serif" font-size="11.5px" font-weight="600" fill="#E9E5DC">• 20 Fichas de Defeito:</text>
    <text x="0" y="34" font-family="Inter, sans-serif" font-size="11.5px" font-weight="400" fill="#8E8A82">  Químicos, microbiológicos, físicos</text>
    <text x="0" y="56" font-family="Inter, sans-serif" font-size="11.5px" font-weight="600" fill="#E9E5DC">• Compostos Marcadores &amp; Limiares</text>
    <text x="0" y="76" font-family="Inter, sans-serif" font-size="11.5px" font-weight="600" fill="#E9E5DC">• Catálogo de 19 Produtos:</text>
    <text x="0" y="94" font-family="Inter, sans-serif" font-size="11.5px" font-weight="400" fill="#8E8A82">  SO₂, colagens, clarificantes, etc.</text>
    <text x="0" y="116" font-family="Inter, sans-serif" font-size="11.5px" font-weight="600" fill="#E9E5DC">• Comparação Direta PT/UE ↔ Brasil</text>
    <text x="0" y="136" font-family="Inter, sans-serif" font-size="11.5px" font-weight="600" fill="#E9E5DC">• Histórico Local de Diagnósticos</text>
    <text x="0" y="156" font-family="Inter, sans-serif" font-size="11.5px" font-weight="600" fill="#E9E5DC">• Multilíngue (PT, EN, ES, ZH)</text>
    <text x="0" y="196" font-family="JetBrains Mono, monospace" font-size="9.5px" fill="#E9E5DC">&gt; Corpus Técnico Completo</text>
  </g>
</g>
</svg>
